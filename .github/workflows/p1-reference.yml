name: P1 Reference Implementation

on:
  pull_request:
  push:
    branches:
      - impl/p1-reference-slice-1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test
        run: npm test
